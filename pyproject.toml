[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evaltable"
version = "0.1.0"
description = "Read evaluation harness result files into one per-item table and check runs for differences that make their scores incomparable."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "scipy>=1.11",
]

[project.scripts]
evaltable = "evaltable.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/evaltable"

[tool.hatch.build.targets.wheel]
packages = ["src/evaltable"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
